[project]
name = "autocanal"
version = "0.1.0"
description = "Criação e publicação automática de vídeos no YouTube"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "pyyaml",
    "pydantic>=2",
    "jsonschema",
    "pillow",
    "faster-whisper",
    "requests",
    "typer",
]

[project.scripts]
autocanal = "autocanal.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autocanal"]

[tool.pytest.ini_options]
markers = ["real: usa rede/GPU/Claude"]
addopts = "-m 'not real'"
