[project]
name = "autocanal-flux"
version = "0.1.0"
description = "FLUX.2 [klein] 4B local em lote para o autocanal (chamado como subprocesso)"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.8",
    "diffusers>=0.42",
    "transformers>=5.0",
    "accelerate>=1.10",
    "safetensors",
    "bitsandbytes>=0.48",
    "psutil",
    "pillow",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
