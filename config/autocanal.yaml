fuso: America/Sao_Paulo
folga_dias: 3
ffmpeg: vendor/bin/ffmpeg
ffprobe: vendor/bin/ffprobe
plugin_dir: ~/.claude/plugins/cache/youtube-agent-skill/youtube-agent/1.0.0
client_secret: config/client_secret.json
kokoro_url: http://127.0.0.1:8880
ia:
  padrao: claude                 # provedor das etapas sem exceção
  etapas: {}                     # só as exceções, ex.: {curadoria: codex}
  max_turns: {roteiro: 30, metadados: 20, revisao: 30, temas: 15, curadoria: 25}
  provedores:
    claude:
      bin: claude
      modelos: {metadados: sonnet, temas: sonnet}
      # explícito: a chamada enxuta não lê o ~/.claude/settings.json (que define xhigh)
      esforco: {roteiro: xhigh, curadoria: xhigh, metadados: xhigh, revisao: xhigh, temas: xhigh}
flux:
  projeto: servicos/flux
